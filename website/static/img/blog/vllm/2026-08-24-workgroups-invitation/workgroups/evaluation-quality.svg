<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" aria-labelledby="title desc" role="img" viewBox="0 0 1672 941"><title id="title">Evaluation and Quality Workgroup</title><desc id="desc">Capabilities from every technical direction enter one shared evaluation contract. Signal and model quality, routing decisions, MoM outcomes, serving performance, platform compatibility, and end-to-end workflows are measured through reproducible benchmarks and regression gates before results are published.</desc><defs><linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1d2939" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#111827" d="M0 0l10 5-10 5z"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt,.st{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card,.line{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke-width:2.5;marker-end:url(#arrow)}</style></defs><rect width="1672" height="941" fill="#fff"/><g class="s"><path fill="#FDB515" d="M0 8.65h16.22V40L0 8.65z" transform="translate(48 35)"/><path fill="#30A2FF" d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" transform="translate(48 35)"/><text x="53" y="25" fill="#111827" font-size="25" font-weight="780" transform="translate(48 35)">vLLM</text><text x="53" y="42" fill="#475467" font-size="12" font-weight="720" letter-spacing="1.4" transform="translate(48 35)">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 07</text><text x="1624" y="75" fill="#2563eb" font-size="16" font-weight="650">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">EVALUATION &amp; QUALITY</text><text x="836" y="137" class="sub">Make every supported capability measurable and every change verifiable.</text></g><g class="s" filter="url(#shadow)"><rect width="292" height="508" x="43" y="194" fill="#fcfcfd" class="card" rx="16"/><text x="189" y="232" class="pt" text-anchor="middle">WHAT WE MEASURE</text><text x="189" y="256" class="sm" text-anchor="middle">Capabilities stay owned by their domains</text><rect width="234" height="53" x="72" y="286" fill="url(#blue)" stroke="#111827" stroke-width="1.8" rx="10"/><circle cx="99" cy="312" r="10" fill="#60a5fa"/><text x="121" y="318" class="st">Router Models</text><rect width="234" height="53" x="72" y="355" fill="url(#green)" stroke="#111827" stroke-width="1.8" rx="10"/><circle cx="99" cy="381" r="10" fill="#7bc66c"/><text x="121" y="387" class="st">MoM + recipes</text><rect width="234" height="53" x="72" y="424" fill="url(#amber)" stroke="#111827" stroke-width="1.8" rx="10"/><circle cx="99" cy="450" r="10" fill="#f7b84b"/><text x="121" y="456" class="st">Data Plane</text><rect width="234" height="53" x="72" y="493" fill="url(#violet)" stroke="#111827" stroke-width="1.8" rx="10"/><circle cx="99" cy="519" r="10" fill="#9b8ae6"/><text x="121" y="525" class="st">Enterprise + env.</text><rect width="234" height="53" x="72" y="562" fill="url(#blue)" stroke="#111827" stroke-width="1.8" rx="10"/><circle cx="99" cy="588" r="10" fill="#60a5fa"/><text x="121" y="594" class="st">Agentic + context</text><rect width="234" height="45" x="72" y="631" fill="url(#green)" stroke="#111827" stroke-width="1.8" rx="10"/><circle cx="99" cy="653" r="10" fill="#7bc66c"/><text x="121" y="659" class="st">Developer workflows</text></g><path d="M335 448h49" class="line"/><g class="s" filter="url(#shadow)"><rect width="392" height="508" x="386" y="194" fill="url(#blue)" class="card" rx="16"/><text x="582" y="232" class="pt" text-anchor="middle">SHARED EVALUATION CONTRACT</text><text x="582" y="256" class="sm" text-anchor="middle">Comparable results require more than a score</text><rect width="330" height="72" x="417" y="290" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="#bfdbfe" stroke="#111827" stroke-width="2" d="M444 311h39v31h-39z"/><path stroke="#111827" stroke-width="1.8" d="M453 320h21M453 330h15"/><text x="503" y="320" class="st">BENCHMARK DEFINITION</text><text x="503" y="344" class="sm">task · dataset · provenance</text><rect width="330" height="72" x="417" y="382" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="none" stroke="#388e3c" stroke-width="2.5" d="M444 437v-38h39v38M453 427v-16M463 427v-24M473 427v-10"/><text x="503" y="412" class="st">METRICS + COMPARISON</text><text x="503" y="436" class="sm">quality · cost · latency · safety</text><rect width="330" height="72" x="417" y="474" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="#fde68a" stroke="#111827" stroke-width="2" d="M443 497h40v30h-40z"/><path stroke="#111827" stroke-width="1.8" d="M451 507h24M451 517h16"/><text x="503" y="504" class="st">REPRODUCIBLE RUN</text><text x="503" y="528" class="sm">version · config · seed · environment</text><rect width="330" height="72" x="417" y="566" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><circle cx="463" cy="602" r="20" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><path fill="none" stroke="#111827" stroke-width="2.5" d="M453 602l7 7 14-18"/><text x="503" y="596" class="st">ACCEPTANCE RULE</text><text x="503" y="620" fill="#475467" font-size="13">baseline · threshold · regression policy</text><text x="582" y="673" class="sm" text-anchor="middle">Same claim → same evidence structure</text></g><path d="M778 448h49" class="line"/><g class="s" filter="url(#shadow)"><rect width="484" height="548" x="829" y="174" fill="#fcfcfd" class="card" rx="17"/><text x="1071" y="213" class="pt" text-anchor="middle">EVALUATION STACK</text><text x="1071" y="237" class="sm" text-anchor="middle">Measure each layer, then validate the system end to end</text><rect width="410" height="68" x="866" y="270" fill="url(#green)" stroke="#111827" stroke-width="2" rx="10"/><text x="889" y="298" class="st">1 · SIGNAL / MODEL</text><text x="889" y="322" class="sm">accuracy · calibration · robustness · speed</text><rect width="370" height="68" x="886" y="352" fill="url(#blue)" stroke="#111827" stroke-width="2" rx="10"/><text x="909" y="380" class="st">2 · ROUTING DECISION</text><text x="909" y="404" class="sm">selection quality · regret · policy compliance</text><rect width="330" height="68" x="906" y="434" fill="url(#amber)" stroke="#111827" stroke-width="2" rx="10"/><text x="929" y="462" class="st">3 · MoM OUTCOME</text><text x="929" y="486" class="sm">answer quality · cost · model card results</text><rect width="290" height="68" x="926" y="516" fill="url(#violet)" stroke="#111827" stroke-width="2" rx="10"/><text x="949" y="544" class="st">4 · SERVING / PLATFORM</text><text x="949" y="568" class="sm">performance · compatibility · recovery</text><rect width="250" height="68" x="946" y="598" fill="#fff" stroke="#2563eb" stroke-width="2.5" rx="10"/><text x="1071" y="626" class="st" text-anchor="middle">5 · END TO END</text><text x="1071" y="650" class="sm" text-anchor="middle">real workflow · supported path</text><path d="M1071 338v14M1071 420v14M1071 502v14M1071 584v14" class="line"/></g><path d="M1313 448h49" class="line"/><g class="s" filter="url(#shadow)"><rect width="264" height="508" x="1364" y="194" fill="url(#green)" class="card" rx="16"/><text x="1496" y="232" class="pt" text-anchor="middle">QUALITY GATES</text><text x="1496" y="256" class="sm" text-anchor="middle">Protect supported behavior</text><path fill="#b9e4ae" stroke="#111827" stroke-width="2.3" d="M1496 291c22 19 52 22 52 22v43c0 45-28 69-52 82-24-13-52-37-52-82v-43s30-3 52-22z"/><path fill="none" stroke="#111827" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M1472 361l17 17 33-45"/><text x="1496" y="479" class="st" text-anchor="middle">REGRESSION CHECKS</text><text x="1496" y="505" class="sm" text-anchor="middle">CI · E2E · performance</text><text x="1496" y="529" class="sm" text-anchor="middle">compatibility · security</text><line x1="1407" x2="1585" y1="556" y2="556" stroke="#98a2b3" stroke-dasharray="5 5"/><text x="1496" y="588" class="st" text-anchor="middle">PUBLISH RESULTS</text><text x="1496" y="614" class="sm" text-anchor="middle">model card · benchmark report</text><text x="1496" y="638" class="sm" text-anchor="middle">known limits · reproducible setup</text><rect width="122" height="27" x="1435" y="658" fill="#fff" stroke="#388e3c" rx="13"/><text x="1496" y="677" class="tiny" text-anchor="middle">PASS / BLOCK</text></g><g class="s"><text x="836" y="775" class="pt" text-anchor="middle">SHARED MEASUREMENT · DISTRIBUTED ACCOUNTABILITY</text><rect width="548" height="65" x="211" y="806" fill="url(#blue)" stroke="#111827" stroke-width="2" rx="12"/><text x="485" y="833" class="st" text-anchor="middle">EVALUATION &amp; QUALITY DEFINES</text><text x="485" y="856" class="sm" text-anchor="middle">common contracts · reproducibility · shared gates</text><path d="M759 839h154" class="line"/><rect width="548" height="65" x="915" y="806" fill="url(#amber)" stroke="#111827" stroke-width="2" rx="12"/><text x="1189" y="833" class="st" text-anchor="middle">EACH TECHNICAL WORKGROUP OWNS</text><text x="1189" y="856" class="sm" text-anchor="middle">its quality target · implementation · regression fix</text></g><g class="s"><rect width="1592" height="1" x="40" y="900" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">benchmark contracts · result publication · model-card requirements · CI/E2E/performance quality gates</text><text x="1624" y="925" class="sm" text-anchor="end">Does not replace domain ownership, Maintainer review, or release decisions</text></g></svg>