<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" aria-labelledby="title desc" role="img" viewBox="0 0 1672 941"><title id="title">Data Plane and Networking Workgroup</title><desc id="desc">Standalone HTTP and Envoy ExtProc entry modes converge on one shared routing core, then dispatch to model backends and stream a response. Performance, reliability, and observability apply across the complete live path.</desc><defs><linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1d2939" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#111827" d="M0 0l10 5-10 5z"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt,.st{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card,.line{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke-width:2.5;marker-end:url(#arrow)}</style></defs><rect width="1672" height="941" fill="#fff"/><g class="s"><path fill="#FDB515" d="M0 8.65h16.22V40L0 8.65z" transform="translate(48 35)"/><path fill="#30A2FF" d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" transform="translate(48 35)"/><text x="53" y="25" fill="#111827" font-size="25" font-weight="780" transform="translate(48 35)">vLLM</text><text x="53" y="42" fill="#475467" font-size="12" font-weight="720" letter-spacing="1.4" transform="translate(48 35)">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 03</text><text x="1624" y="75" fill="#2563eb" font-size="16" font-weight="650">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">DATA PLANE &amp; NETWORKING</text><text x="836" y="137" class="sub">Execute every routing decision through one fast, reliable, portable request path.</text></g><g class="s" filter="url(#shadow)"><rect width="198" height="244" x="44" y="292" fill="url(#blue)" class="card" rx="15"/><text x="143" y="331" class="pt" text-anchor="middle">CLIENT</text><rect width="116" height="85" x="85" y="359" fill="#fff" stroke="#111827" stroke-width="2" rx="10"/><path stroke="#111827" stroke-width="2" d="M103 382h80M103 399h55M103 416h67"/><circle cx="103" cy="468" r="6" fill="#30a2ff"/><text x="143" y="474" fill="#475467" font-size="13">request stream</text><text x="143" y="505" class="sm" text-anchor="middle">OpenAI-compatible traffic</text></g><path d="M242 414h57" class="line"/><g class="s" filter="url(#shadow)"><rect width="330" height="430" x="301" y="199" fill="#fcfcfd" class="card" rx="17"/><text x="466" y="237" class="pt" text-anchor="middle">ENTRY MODES</text><text x="466" y="261" class="sm" text-anchor="middle">Choose the boundary—not the routing behavior</text><rect width="270" height="126" x="331" y="291" fill="url(#blue)" stroke="#111827" stroke-width="2" rx="12"/><rect width="56" height="46" x="355" y="320" fill="#fff" stroke="#111827" stroke-width="2" rx="7"/><path stroke="#2563eb" stroke-width="2" d="M365 335h36M365 348h26"/><text x="433" y="330" class="st">STANDALONE</text><text x="433" y="354" class="sm">Native HTTP server</text><text x="433" y="378" class="sm">Docker · Kubernetes</text><text x="433" y="399" fill="#475467" font-size="12">No Envoy dependency</text><text x="466" y="447" class="tiny" text-anchor="middle">OR</text><rect width="270" height="126" x="331" y="474" fill="url(#violet)" stroke="#111827" stroke-width="2" rx="12"/><path fill="#fff" stroke="#111827" stroke-width="2" d="M355 511h56v47h-56z"/><path stroke="#6d5bd0" stroke-width="2" d="M366 525h34M366 538h34M383 511v47"/><text x="429" y="513" fill="#111827" font-size="14" font-weight="750">GATEWAY-INTEGRATED</text><text x="433" y="537" class="sm">Envoy ExtProc</text><text x="433" y="561" class="sm">Existing gateway stack</text></g><path fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)" d="M631 354h51v60h42M631 537h51V414h42"/><g class="s" filter="url(#shadow)"><rect width="403" height="344" x="726" y="242" fill="url(#green)" class="card" rx="17"/><text x="927.5" y="280" class="pt" text-anchor="middle">SHARED ROUTING CORE</text><text x="927.5" y="304" class="sm" text-anchor="middle">The same semantics in both entry modes</text><rect width="96" height="92" x="758" y="337" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><circle cx="806" cy="365" r="14" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><text x="806" y="399" class="st" text-anchor="middle">SIGNALS</text><path d="M854 383h43" class="line"/><rect width="96" height="92" x="899" y="337" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path stroke="#111827" stroke-width="2" d="M923 365h48M947 347v36"/><text x="947" y="399" class="st" text-anchor="middle">DECIDE</text><path d="M995 383h43" class="line"/><rect width="58" height="92" x="1040" y="337" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="#fde68a" stroke="#111827" stroke-width="1.6" d="M1055 354h28v28h-28zM1055 389h28v16h-28z"/><text x="1069" y="450" class="sm" text-anchor="middle">plugins</text><rect width="340" height="70" x="758" y="477" fill="#fff" stroke="#388e3c" stroke-width="2" rx="11"/><text x="928" y="506" class="st" text-anchor="middle">ONE EXECUTION CONTRACT</text><text x="928" y="530" class="sm" text-anchor="middle">request · response · errors · telemetry</text></g><path d="M1129 414h53" class="line"/><g class="s" filter="url(#shadow)"><rect width="264" height="344" x="1184" y="242" fill="url(#amber)" class="card" rx="17"/><text x="1316" y="280" class="pt" text-anchor="middle">DISPATCH</text><text x="1316" y="304" class="sm" text-anchor="middle">Engine-neutral connectivity</text><rect width="202" height="170" x="1215" y="337" fill="#fff" stroke="#111827" stroke-width="2" rx="12"/><circle cx="1261" cy="383" r="22" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><text x="1261" y="389" class="st" text-anchor="middle">A</text><circle cx="1371" cy="383" r="22" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><text x="1371" y="389" class="st" text-anchor="middle">B</text><circle cx="1316" cy="455" r="22" fill="#fde68a" stroke="#111827" stroke-width="2"/><text x="1316" y="461" class="st" text-anchor="middle">C</text><path fill="none" stroke="#111827" stroke-width="2" d="M1261 405v20l55 8 55-8v-20M1316 433v-28"/><text x="1316" y="537" class="sm" text-anchor="middle">Backend pool + endpoints</text><text x="1316" y="560" class="sm" text-anchor="middle">Retry · fallback · recovery</text></g><path d="M1448 414h47" class="line"/><g class="s" filter="url(#shadow)"><rect width="131" height="244" x="1497" y="292" fill="url(#green)" class="card" rx="15"/><text x="1562.5" y="331" class="pt" text-anchor="middle">STREAM</text><path stroke="#388e3c" stroke-linecap="round" stroke-width="5" d="M1528 370h69M1528 394h48M1528 418h60"/><path stroke="#111827" stroke-width="2" marker-end="url(#arrow)" d="M1530 465h63"/><text x="1562.5" y="505" class="sm" text-anchor="middle">One response</text></g><g class="s"><text x="836" y="684" class="pt" text-anchor="middle">ONE LIVE-PATH QUALITY BAR</text><text x="836" y="709" class="sm" text-anchor="middle">Every mode must preserve behavior while meeting measurable performance and reliability targets</text><rect width="294" height="102" x="143" y="747" fill="url(#blue)" stroke="#111827" stroke-width="2" rx="12"/><path fill="none" stroke="#2563eb" stroke-width="3" d="M174 805l18-35 18 35 18-21 18 21"/><text x="268" y="780" class="st">PERFORMANCE</text><text x="268" y="811" fill="#667085" font-size="11" font-weight="650">P50 / P99 · THROUGHPUT</text><text x="268" y="833" fill="#667085" font-size="11" font-weight="650">STREAMING · EFFICIENCY</text><rect width="294" height="102" x="478" y="747" fill="url(#green)" stroke="#111827" stroke-width="2" rx="12"/><path fill="#b9e4ae" stroke="#111827" stroke-width="2" d="M510 777c10 9 20 10 20 10v16c0 16-10 24-20 29-10-5-20-13-20-29v-16s10-1 20-10z"/><text x="551" y="780" class="st">RELIABILITY</text><text x="551" y="811" fill="#667085" font-size="11" font-weight="650">TIMEOUT · RETRY · FALLBACK</text><text x="551" y="833" fill="#667085" font-size="11" font-weight="650">RECOVERY · BACKPRESSURE</text><rect width="294" height="102" x="813" y="747" fill="url(#amber)" stroke="#111827" stroke-width="2" rx="12"/><circle cx="850" cy="798" r="23" fill="#fde68a" stroke="#111827" stroke-width="2"/><path fill="none" stroke="#111827" stroke-width="2" d="M850 783v17l12 8"/><text x="891" y="780" class="st">CONSISTENCY</text><text x="891" y="811" fill="#667085" font-size="11" font-weight="650">SAME SEMANTICS IN BOTH MODES</text><text x="891" y="833" fill="#667085" font-size="11" font-weight="650">ERRORS · HEADERS · STREAMING</text><rect width="381" height="102" x="1148" y="747" fill="url(#violet)" stroke="#111827" stroke-width="2" rx="12"/><path fill="none" stroke="#6d5bd0" stroke-width="3" d="M1180 823v-42h56v42M1194 812v-20M1208 812v-10M1222 812v-28"/><text x="1254" y="780" class="st">OBSERVABILITY</text><text x="1254" y="811" fill="#667085" font-size="11" font-weight="650">TRACES · METRICS · ROUTE METADATA</text><text x="1254" y="833" fill="#667085" font-size="11" font-weight="650">REPRODUCIBLE PERFORMANCE EVIDENCE</text></g><g class="s"><rect width="1592" height="1" x="40" y="900" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">live request path · standalone mode · Envoy/gateway integration · backend dispatch · performance</text><text x="1624" y="925" class="sm" text-anchor="end">Enterprise defines access policy · MoM defines the routing decision</text></g></svg>