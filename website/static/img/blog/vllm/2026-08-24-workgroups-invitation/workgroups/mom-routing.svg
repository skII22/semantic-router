317v35h38"/><rect width="64" height="46" x="102" y="345" fill="#b9d9ff" stroke="#111827" stroke-width="2" rx="13"/><circle cx="119" cy="368" r="3.3" fill="#111827"/><circle cx="134" cy="368" r="3.3" fill="#111827"/><circle cx="149" cy="368" r="3.3" fill="#111827"/><path fill="#b9d9ff" stroke="#111827" stroke-width="2" d="M114 391l-10 10v-17"/><circle cx="105" cy="421" r="3.3" fill="#475467"/><line x1="118" x2="183" y1="421" y2="421" stroke="#111827" stroke-width="2"/><circle cx="105" cy="441" r="3.3" fill="#475467"/><line x1="118" x2="174" y1="441" y2="441" stroke="#111827" stroke-width="2"/><text x="145" y="500" class="body" text-anchor="middle">Stable model name</text><text x="145" y="520" class="small" text-anchor="middle">OpenAI-compatible API</text></g><path d="M250 392 H298" class="line"/><g class="sans" filter="url(#soft-shadow)"><rect width="278" height="366" x="300" y="209" fill="url(#blue-panel)" class="card" rx="15"/><text x="439" y="248" class="panel-title" text-anchor="middle">VERSIONED RECIPE</text><rect width="220" height="55" x="329" y="269" fill="#fff" stroke="#2563eb" stroke-width="2" rx="10"/><text x="346" y="291" fill="#2563eb" class="tiny">OBJECTIVE</text><text x="346" y="312" class="body">Quality · Cost · Latency</text><text x="333" y="355" class="section-title">Signals</text><rect width="62" height="28" x="333" y="369" fill="#dbeafe" stroke="#93c5fd" rx="14"/><text x="364" y="388" class="small" text-anchor="middle">intent</text><rect width="87" height="28" x="402" y="369" fill="#dbeafe" stroke="#93c5fd" rx="14"/><text x="445.5" y="388" fill="#475467" font-size="13" text-anchor="middle">complexity</text><rect width="49" height="28" x="496" y="369" fill="#dbeafe" stroke="#93c5fd" rx="14"/><text x="520.5" y="388" class="small" text-anchor="middle">risk</text><text x="333" y="431" class="section-title">Constraints</text><text x="333" y="457" class="body">Policy · Budget · Availability</text><line x1="333" x2="545" y1="481" y2="481" stroke="#98a2b3" stroke-dasharray="5 5" stroke-width="1.5"/><text x="333" y="516" class="section-title">Routing decision</text><rect width="60" height="31" x="485" y="500" fill="#fff" stroke="#2563eb" stroke-width="1.8" rx="8"/><text x="515" y="521" fill="#2563eb" font-size="14" font-weight="720" text-anchor="middle">v12</text><text x="439" y="552" class="small" text-anchor="middle">Portable · reviewable · reversible</text></g><path d="M578 392 H622" class="line"/><g class="sans" filter="url(#soft-shadow)"><rect width="618" height="456" x="624" y="164" fill="#fcfcfd" class="card" rx="17"/><text x="933" y="201" class="panel-title" text-anchor="middle">MODEL POOL + COLLABORATION</text><text x="933" y="225" class="small" text-anchor="middle">Qualified models work together through one bounded execution contract</text><rect width="275" height="157" x="649" y="248" fill="url(#blue-panel)" stroke="#111827" stroke-width="1.9" rx="12"/><text x="786.5" y="278" class="section-title" text-anchor="middle">SELECT</text><g color="#8bc1ff" transform="translate(694 298)"><use href="#cube"/></g><g color="#9ed58f" transform="translate(768 298)"><use href="#cube"/></g><g color="#ffc86d" transform="translate(842 298)"><use href="#cube"/></g><path fill="none" stroke="#111827" stroke-width="2" d="M712 350 V374 H842 V350 M777 350 V374"/><path d="M777 374 V389" class="line"/><text x="786.5" y="394" class="small" text-anchor="middle">Best qualified model</text><rect width="275" height="157" x="942" y="248" fill="url(#green-panel)" stroke="#111827" stroke-width="1.9" rx="12"/><text x="1079.5" y="278" class="section-title" text-anchor="middle">CASCADE / FALLBACK</text><g color="#8bc1ff" transform="translate(974 312)"><use href="#cube"/></g><line x1="1015" x2="1055" y1="333" y2="333" stroke="#111827" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="1072" cy="333" r="10" fill="#fff" stroke="#111827" stroke-width="2"/><line x1="1083" x2="1125" y1="333" y2="333" stroke="#111827" stroke-dasharray="7 5" stroke-width="2.2" marker-end="url(#arrow)"/><g color="#9ed58f" transform="translate(1140 312)"><use href="#cube"/></g><text x="1079.5" y="386" class="small" text-anchor="middle">Escalate only when needed</text><rect width="275" height="167" x="649" y="424" fill="url(#amber-panel)" stroke="#111827" stroke-width="1.9" rx="12"/><text x="786.5" y="454" class="section-title" text-anchor="middle">PARALLEL + JUDGE</text><g color="#8bc1ff" transform="translate(683 474) scale(.82)"><use href="#cube"/></g><g color="#9ed58f" transform="translate(755 474) scale(.82)"><use href="#cube"/></g><g color="#ffc86d" transform="translate(827 474) scale(.82)"><use href="#cube"/></g><path fill="none" stroke="#111827" stroke-width="2" d="M698 512 V532 H844 V512 M770 512 V532"/><path d="M770 532 V547" class="line"/><circle cx="770" cy="557" r="17" fill="#fff" stroke="#111827" stroke-width="2"/><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M761 557l6 6 13-15"/><text x="855" y="563" class="small" text-anchor="middle">Compare answers</text><rect width="275" height="167" x="942" y="424" fill="url(#violet-panel)" stroke="#111827" stroke-width="1.9" rx="12"/><text x="1079.5" y="454" class="section-title" text-anchor="middle">FUSION / WORKFLOW</text><g color="#8bc1ff" transform="translate(971 489) scale(.72)"><use href="#cube"/></g><line x1="1005" x2="1038" y1="504" y2="504" stroke="#111827" stroke-width="2.2" marker-end="url(#arrow)"/><rect width="42" height="42" x="1045" y="484" fill="#fde68a" stroke="#111827" stroke-width="2" rx="10"/><path fill="none" stroke="#111827" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M1057 505l8 8 12-17"/><line x1="1089" x2="1122" y1="504" y2="504" stroke="#111827" stroke-width="2.2" marker-end="url(#arrow)"/><rect width="42" height="42" x="1129" y="484" fill="#ddd6fe" stroke="#111827" stroke-width="2" rx="10"/><text x="1150" y="512" fill="#111827" font-size="25" font-weight="700" text-anchor="middle">Σ</text><text x="1079.5" y="563" class="small" text-anchor="middle">Combine bounded steps</text></g><path d="M1242 392 H1286" class="line"/><g class="sans" filter="url(#soft-shadow)"><rect width="210" height="290" x="1288" y="247" fill="url(#green-panel)" class="card" rx="15"/><text x="1393" y="285" class="panel-title" text-anchor="middle">ONE RESPONSE</text><rect width="124" height="148" x="1331" y="317" fill="#fff" stroke="#111827" stroke-width="2.2" rx="10"/><path fill="#f8fafc" stroke="#111827" stroke-width="2.2" d="M1417 317v35h38"/><rect width="64" height="46" x="1350" y="345" fill="#cceec3" stroke="#111827" stroke-width="2" rx="13"/><line x1="1364" x2="1400" y1="362" y2="362" stroke="#111827" stroke-width="2"/><line x1="1364" x2="1390" y1="374" y2="374" stroke="#111827" stroke-width="2"/><path fill="#cceec3" stroke="#111827" stroke-width="2" d="M1362 391l-10 10v-17"/><circle cx="1353" cy="421" r="3.3" fill="#475467"/><line x1="1366" x2="1431" y1="421" y2="421" stroke="#111827" stroke-width="2"/><circle cx="1353" cy="441" r="3.3" fill="#475467"/><line x1="1366" x2="1422" y1="441" y2="441" stroke="#111827" stroke-width="2"/><text x="1393" y="500" class="body" text-anchor="middle">Measurable behavior</text><text x="1393" y="520" class="small" text-anchor="middle">One MoM identity</text></g><g class="sans"><text x="836" y="675" class="panel-title" text-anchor="middle">CONTROLLED IMPROVEMENT LOOP</text><text x="836" y="700" class="small" text-anchor="middle">Change the recipe without making production behavior unpredictable</text><rect width="238" height="93" x="242" y="729" fill="url(#blue-panel)" stroke="#111827" stroke-width="2" rx="12"/><circle cx="278" cy="775" r="19" fill="#fff" stroke="#2563eb" stroke-width="2"/><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M270 775l6 6 12-15"/><text x="309" y="764" class="section-title">EVALUATE</text><text x="309" y="790" class="small">Quality · cost · latency</text><path d="M480 775 H531" class="line"/><rect width="238" height="93" x="533" y="729" fill="url(#amber-panel)" stroke="#111827" stroke-width="2" rx="12"/><rect width="42" height="48" x="559" y="752" fill="#fff" stroke="#111827" stroke-width="2" rx="6"/><path stroke="#111827" stroke-width="2" d="M570 767h20M570 777h20M570 787h14"/><text x="619" y="764" class="section-title">CANDIDATE</text><text x="619" y="790" class="small">Versioned recipe</text><path d="M771 775 H822" class="line"/><rect width="238" height="93" x="824" y="729" fill="url(#violet-panel)" stroke="#111827" stroke-width="2" rx="12"/><path fill="#ddd6fe" stroke="#111827" stroke-width="2" d="M852 796V761l18-11 18 11v35l-18 11z"/><path fill="none" stroke="#111827" stroke-width="1.7" d="M870 750v57M852 761l18 11 18-11"/><text x="900" y="764" fill="#111827" font-size="15" font-weight="760">SHADOW / CANARY</text><text x="900" y="790" class="small">Compare before traffic</text><path d="M1062 775 H1113" class="line"/><rect width="315" height="93" x="1115" y="729" fill="url(#green-panel)" stroke="#111827" stroke-width="2" rx="12"/><path fill="none" stroke="#388e3c" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M1145 784l13 13 25-33"/><text x="1200" y="764" class="section-title">PROMOTE OR ROLLBACK</text><text x="1200" y="790" class="small">Auditable activation · safe reversal</text><path d="M1272 822 V864 H361 V824" class="blue-line"/><text x="817" y="888" fill="#2563eb" class="tiny" text-anchor="middle">OUTCOMES + FEEDBACK BECOME THE NEXT REVIEWABLE INPUT</text></g><g class="sans"><rect width="1592" height="1" x="40" y="900" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="small">model pools · versioned recipes · multi-model collaboration · lifecycle policy</text><text x="1624" y="925" class="small" text-anchor="end">Signals come from Router Models · Decisions execute through the Data Plane</text></g></svg>