<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" aria-labelledby="title desc" role="img" viewBox="0 0 1672 941"><title id="title">Developer Experience and Ecosystem Workgroup</title><desc id="desc">A developer journey moves from discovery and installation to configuration, the first routed request, understanding, tuning, sharing, and contribution. CLI, Dashboard, APIs, recipes, documentation, tutorials, and extensions form one approachable experience.</desc><defs><linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1d2939" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#111827" d="M0 0l10 5-10 5z"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt,.st{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card{stroke:#111827;stroke-width:2.2}</style></defs><rect width="1672" height="941" fill="#fff"/><g class="s"><path fill="#FDB515" d="M0 8.65h16.22V40L0 8.65z" transform="translate(48 35)"/><path fill="#30A2FF" d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" transform="translate(48 35)"/><text x="53" y="25" fill="#111827" font-size="25" font-weight="780" transform="translate(48 35)">vLLM</text><text x="53" y="42" fill="#475467" font-size="12" font-weight="720" letter-spacing="1.4" transform="translate(48 35)">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 06</text><text x="1624" y="75" fill="#2563eb" font-size="16" font-weight="650">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">DEVELOPER EXPERIENCE &amp; ECOSYSTEM</text><text x="836" y="137" class="sub">Make vLLM Semantic Router easy to discover, install, configure, extend, and operate.</text></g><g class="s"><text x="836" y="194" class="pt" text-anchor="middle">ONE APPROACHABLE DEVELOPER JOURNEY</text><text x="836" y="219" class="sm" text-anchor="middle">Reduce the distance from curiosity to a successful, understood, and shareable routed workload</text><line x1="143" x2="1528" y1="350" y2="350" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect width="206" height="178" x="54" y="261" fill="url(#blue)" class="card" rx="14"/><circle cx="157" cy="311" r="27" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path stroke="#111827" stroke-width="2" d="M145 311h24M157 299v24"/><text x="157" y="365" class="st" text-anchor="middle">1 · DISCOVER</text><text x="157" y="392" class="sm" text-anchor="middle">What problem does it solve?</text><text x="157" y="416" class="sm" text-anchor="middle">Which path fits me?</text></g><g filter="url(#shadow)"><rect width="206" height="178" x="283" y="261" fill="url(#green)" class="card" rx="14"/><path fill="#fff" stroke="#111827" stroke-width="2" d="M352 294h68v49h-68z"/><path stroke="#388e3c" stroke-width="2" d="M365 307h42M365 321h31"/><path fill="none" stroke="#111827" stroke-width="2.5" d="M386 283v36M375 308l11 11 11-11"/><text x="386" y="365" class="st" text-anchor="middle">2 · INSTALL</text><text x="386" y="392" fill="#475467" font-size="13" text-anchor="middle">Supported package + platform</text><text x="386" y="416" class="sm" text-anchor="middle">Clear validation and recovery</text></g><g filter="url(#shadow)"><rect width="206" height="178" x="512" y="261" fill="url(#amber)" class="card" rx="14"/><path fill="#fff" stroke="#111827" stroke-width="2" d="M580 291h70v58h-70z"/><path stroke="#f59e0b" stroke-width="2" d="M593 305h44M593 319h34M593 333h22"/><text x="615" y="365" class="st" text-anchor="middle">3 · CONFIGURE</text><text x="615" y="392" class="sm" text-anchor="middle">Recipe + model pool</text><text x="615" y="416" class="sm" text-anchor="middle">Validate before serving</text></g><g filter="url(#shadow)"><rect width="230" height="218" x="741" y="241" fill="url(#violet)" class="card" rx="14"/><circle cx="856" cy="304" r="35" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><path fill="none" stroke="#111827" stroke-width="3.5" d="M842 304l10 10 20-27"/><text x="856" y="373" fill="#111827" font-size="16" font-weight="750" text-anchor="middle">4 · FIRST ROUTED REQUEST</text><text x="856" y="401" class="sm" text-anchor="middle">One command · visible decision</text><rect width="124" height="25" x="794" y="417" fill="#fff" stroke="#6d5bd0" rx="12"/><text x="856" y="434" class="tiny" text-anchor="middle">TIME TO VALUE ↓</text></g><g filter="url(#shadow)"><rect width="206" height="178" x="994" y="261" fill="url(#blue)" class="card" rx="14"/><path fill="#fff" stroke="#111827" stroke-width="2" d="M1062 292h70v55h-70z"/><path stroke="#2563eb" stroke-width="5" d="M1074 334v-20M1089 334v-31M1104 334v-13M1119 334v-38"/><text x="1097" y="365" class="st" text-anchor="middle">5 · UNDERSTAND</text><text x="1097" y="392" class="sm" text-anchor="middle">Explain route + health</text><text x="1097" y="416" class="sm" text-anchor="middle">Evaluate and tune safely</text></g><g filter="url(#shadow)"><rect width="206" height="178" x="1223" y="261" fill="url(#green)" class="card" rx="14"/><circle cx="1326" cy="317" r="31" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><circle cx="1315" cy="311" r="8" fill="#fff" stroke="#111827"/><circle cx="1338" cy="311" r="8" fill="#fff" stroke="#111827"/><path fill="#fff" stroke="#111827" d="M1303 334c3-11 21-11 24 0M1325 334c3-11 21-11 24 0"/><text x="1326" y="365" class="st" text-anchor="middle">6 · SHARE</text><text x="1326" y="392" class="sm" text-anchor="middle">Use cases + tutorials</text><text x="1326" y="416" class="sm" text-anchor="middle">Extensions + integrations</text></g><g filter="url(#shadow)"><rect width="176" height="178" x="1452" y="261" fill="url(#amber)" class="card" rx="14"/><path fill="#fff" stroke="#111827" stroke-width="2" d="M1502 294h76v48h-76z"/><path stroke="#111827" stroke-width="2" d="M1518 306h44M1518 320h30"/><path stroke="#f59e0b" stroke-width="3" d="M1540 282v60"/><text x="1540" y="365" class="st" text-anchor="middle">7 · CONTRIBUTE</text><text x="1540" y="392" class="sm" text-anchor="middle">Clear issue + epic</text><text x="1540" y="416" class="sm" text-anchor="middle">Reviewable change</text></g></g><g class="s" filter="url(#shadow)"><rect width="1468" height="162" x="102" y="505" fill="#fcfcfd" class="card" rx="17"/><text x="836" y="541" class="pt" text-anchor="middle">CONSISTENT INTERFACES</text><text x="836" y="565" class="sm" text-anchor="middle">Different ways to use the project should expose the same maintained concepts and validation</text><rect width="272" height="51" x="153" y="589" fill="url(#blue)" stroke="#111827" stroke-width="2" rx="10"/><text x="289" y="621" class="st" text-anchor="middle">CLI · INSTALL / DEPLOY / TUNE</text><rect width="272" height="51" x="453" y="589" fill="url(#green)" stroke="#111827" stroke-width="2" rx="10"/><text x="589" y="621" class="st" text-anchor="middle">DASHBOARD · SEE / OPERATE</text><rect width="272" height="51" x="753" y="589" fill="url(#amber)" stroke="#111827" stroke-width="2" rx="10"/><text x="889" y="621" class="st" text-anchor="middle">APIs · AUTOMATE / EXTEND</text><rect width="466" height="51" x="1053" y="589" fill="url(#violet)" stroke="#111827" stroke-width="2" rx="10"/><text x="1286" y="621" class="st" text-anchor="middle">AGENT SKILL · GENERATE / EVALUATE / OPERATE</text></g><g class="s"><text x="836" y="723" class="pt" text-anchor="middle">AN ECOSYSTEM PEOPLE CAN LEARN FROM AND BUILD ON</text><rect width="335" height="97" x="103" y="757" fill="url(#blue)" stroke="#111827" stroke-width="2" rx="12"/><text x="270.5" y="793" class="st" text-anchor="middle">LEARN</text><text x="270.5" y="820" class="sm" text-anchor="middle">docs · reference · tutorials · model cards</text><text x="270.5" y="842" class="sm" text-anchor="middle">blogs · video tutorials</text><rect width="335" height="97" x="473" y="757" fill="url(#green)" stroke="#111827" stroke-width="2" rx="12"/><text x="640.5" y="793" class="st" text-anchor="middle">TRY</text><text x="640.5" y="820" class="sm" text-anchor="middle">recipes · examples · use cases</text><text x="640.5" y="842" class="sm" text-anchor="middle">end-to-end reference paths</text><rect width="335" height="97" x="843" y="757" fill="url(#amber)" stroke="#111827" stroke-width="2" rx="12"/><text x="1010.5" y="793" class="st" text-anchor="middle">EXTEND</text><text x="1010.5" y="820" class="sm" text-anchor="middle">signals · algorithms · integrations</text><text x="1010.5" y="842" class="sm" text-anchor="middle">maintained extension contracts</text><rect width="356" height="97" x="1213" y="757" fill="url(#violet)" stroke="#111827" stroke-width="2" rx="12"/><text x="1391" y="793" class="st" text-anchor="middle">GROW TOGETHER</text><text x="1391" y="820" class="sm" text-anchor="middle">contributor entry points · Workgroups</text><text x="1391" y="842" class="sm" text-anchor="middle">shared stories and reusable knowledge</text></g><g class="s"><rect width="1592" height="1" x="40" y="900" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</t