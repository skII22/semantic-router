<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" aria-labelledby="title desc" role="img" viewBox="0 0 1672 941"><title id="title">MoM and Routing Workgroup</title><desc id="desc">One model call enters a versioned routing recipe and qualified model pool. The recipe can select, cascade, fuse, or run a bounded workflow before returning one response. Evaluation, canary, promotion, and rollback form a controlled improvement loop.</desc><defs><linearGradient id="blue-panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green-panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbfff9"/><stop offset="1" stop-color="#eef8e9"/></linearGradient><linearGradient id="amber-panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#fff3dc"/></linearGradient><linearGradient id="violet-panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fdfcff"/><stop offset="1" stop-color="#f3efff"/></linearGradient><filter id="soft-shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1d2939" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#111827" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><g id="cube"><path fill="currentColor" fill-opacity=".35" stroke="#111827" stroke-width="2" d="M 0 10 L 18 0 L 36 10 L 18 20 Z"/><path fill="currentColor" fill-opacity=".7" stroke="#111827" stroke-width="2" d="M 0 10 L 18 20 L 18 42 L 0 32 Z"/><path fill="currentColor" fill-opacity=".95" stroke="#111827" stroke-width="2" d="M 18 20 L 36 10 L 36 32 L 18 42 Z"/></g><style>.sans{font-family:Inter,