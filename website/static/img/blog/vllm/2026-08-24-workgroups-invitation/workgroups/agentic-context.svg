<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" aria-labelledby="title desc" role="img" viewBox="0 0 1672 941"><title id="title">Agentic and Context Workgroup</title><desc id="desc">A growing long-running session enters a protected context envelope. Memory selection, pruning, compression, and prompt restructuring produce a bounded context. The Router then selects, hands off to, or composes qualified agent backends within explicit collaboration limits.</desc><defs><linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1d2939" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#111827" d="M0 0l10 5-10 5z"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt,.st{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px}.b{font-size:16px;fill:#344054}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card,.line{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke-width:2.5;marker-end:url(#arrow)}</style></defs><rect width="1672" height="941" fill="#fff"/><g class="s"><path fill="#FDB515" d="M0 8.65h16.22V40L0 8.65z" transform="translate(48 35)"/><path fill="#30A2FF" d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" transform="translate(48 35)"/><text x="53" y="25" fill="#111827" font-size="25" font-weight="780" transform="translate(48 35)">vLLM</text><text x="53" y="42" fill="#475467" font-size="12" font-weight="720" letter-spacing="1.4" transform="translate(48 35)">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 05</text><text x="1624" y="75" fill="#2563eb" font-size="16" font-weight="650">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">AGENTIC &amp; CONTEXT</text><text x="836" y="137" class="sub">Optimize context, route agent backends, and bound multi-agent collaboration.</text></g><g class="s" filter="url(#shadow)"><rect width="278" height="424" x="42" y="221" fill="url(#blue)" class="card" rx="16"/><text x="181" y="260" class="pt" text-anchor="middle">LONG SESSION</text><text x="181" y="284" class="sm" text-anchor="middle">Context grows across turns and tools</text><line x1="95" x2="95" y1="326" y2="581" stroke="#2563eb" stroke-width="3"/><circle cx="95" cy="341" r="9" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><rect width="153" height="52" x="123" y="315" fill="#fff" stroke="#111827" stroke-width="2" rx="10"/><text x="141" y="346" fill="#344054" font-size="14">system instructions</text><circle cx="95" cy="409" r="9" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><rect width="153" height="52" x="123" y="383" fill="#fff" stroke="#111827" stroke-width="2" rx="10"/><text x="141" y="414" class="b">user messages</text><circle cx="95" cy="477" r="9" fill="#fde68a" stroke="#111827" stroke-width="2"/><rect width="153" height="52" x="123" y="451" fill="#fff" stroke="#111827" stroke-width="2" rx="10"/><text x="141" y="482" class="b">tool outputs</text><circle cx="95" cy="545" r="9" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><rect width="153" height="52" x="123" y="519" fill="#fff" stroke="#111827" stroke-width="2" rx="10"/><text x="141" y="550" class="b">retrieved memory</text><path fill="#2563eb" d="M95 581l-12-18h24z"/><text x="181" y="615" class="st" text-anchor="middle">TOKENS · COST · RISK ↑</text></g><path d="M320 433h48" class="line"/><g class="s" filter="url(#shadow)"><rect width="308" height="424" x="370" y="221" fill="url(#amber)" class="card" rx="16"/><text x="524" y="260" class="pt" text-anchor="middle">PROTECTED ENVELOPE</text><text x="524" y="284" class="sm" text-anchor="middle">Preserve authority before optimizing tokens</text><path fill="#fde68a" stroke="#111827" stroke-width="2.3" d="M524 315c21 18 51 21 51 21v42c0 44-27 67-51 80-24-13-51-36-51-80v-42s30-3 51-21z"/><path fill="none" stroke="#111827" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M501 385l16 16 32-43"/><rect width="240" height="115" x="404" y="489" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><text x="425" y="518" class="st">MUST SURVIVE</text><circle cx="425" cy="545" r="4" fill="#f59e0b"/><text x="439" y="550" class="sm">system + developer instructions</text><circle cx="425" cy="572" r="4" fill="#f59e0b"/><text x="439" y="577" class="sm">authorization + tool contracts</text><text x="524" y="628" class="sm" text-anchor="middle">No silent lossy transformation</text></g><path d="M678 433h48" class="line"/><g class="s" filter="url(#shadow)"><rect width="488" height="518" x="728" y="174" fill="#fcfcfd" class="card" rx="17"/><text x="972" y="213" class="pt" text-anchor="middle">CONTEXT OPTIMIZATION</text><text x="972" y="237" class="sm" text-anchor="middle">Transform history under explicit budgets and safety constraints</text><rect width="200" height="118" x="758" y="270" fill="url(#blue)" stroke="#111827" stroke-width="2" rx="12"/><circle cx="798" cy="316" r="20" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path stroke="#111827" stroke-width="2" d="M790 316h16M798 308v16"/><text x="829" y="306" class="st">SELECT</text><text x="829" y="330" class="sm">memory + retrieval</text><text x="858" y="367" class="sm" text-anchor="middle">keep what the task needs</text><rect width="200" height="118" x="986" y="270" fill="url(#green)" stroke="#111827" stroke-width="2" rx="12"/><path fill="#b9e4ae" stroke="#111827" stroke-width="2" d="M1019 301h46v46h-46z"/><path stroke="#111827" stroke-width="2" d="M1028 314h28M1028 326h20"/><path stroke="#111827" stroke-width="2.5" d="M1013 292l57 64"/><text x="1081" y="306" class="st">PRUNE</text><text x="1081" y="330" fill="#475467" font-size="12">messages + tools</text><text x="1086" y="367" class="sm" text-anchor="middle">remove low-value history</text><rect width="200" height="118" x="758" y="415" fill="url(#amber)" stroke="#111827" stroke-width="2" rx="12"/><path stroke="#f59e0b" stroke-linecap="round" stroke-width="5" d="M783 452h64M793 465h44M803 478h24"/><text x="858" y="452" class="st">COMPRESS</text><text x="858" y="476" fill="#475467" font-size="12">summarize safely</text><text x="858" y="511" class="sm" text-anchor="middle">reduce tokens with receipts</text><rect width="200" height="118" x="986" y="415" fill="url(#violet)" stroke="#111827" stroke-width="2" rx="12"/><path stroke="#6d5bd0" stroke-width="3" d="M1014 449h54M1014 464h38M1014 479h46"/><path fill="none" stroke="#111827" stroke-width="2" d="M1062 442l15 15-15 15"/><text x="1081" y="452" fill="#111827" font-size="14" font-weight="750">RESTRUCTURE</text><text x="1081" y="476" fill="#475467" font-size="11">prompt + sections</text><text x="1086" y="511" class="sm" text-anchor="middle">restore useful ordering</text><path fill="none" stroke="#111827" stroke-width="2" d="M858 533v41h228v-41M972 533v41"/><path d="M972 574v25" class="line"/><rect width="320" height="59" x="812" y="601" fill="#fff" stroke="#2563eb" stroke-width="2" rx="11"/><text x="972" y="626" class="st" text-anchor="middle">BOUNDED CONTEXT</text><text x="972" y="648" class="sm" text-anchor="middle">protected · compact · traceable</text></g><path d="M1216 433h46" class="line"/><g class="s" filter="url(#shadow)"><rect width="364" height="424" x="1264" y="221" fill="url(#green)" class="card" rx="16"/><text x="1446" y="260" class="pt" text-anchor="middle">AGENT ROUTING</text><text x="1446" y="284" class="sm" text-anchor="middle">Select one agent or compose a bounded team</text><rect width="300" height="66" x="1296" y="318" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><circle cx="1326" cy="351" r="15" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><text x="1326" y="356" fill="#111827" font-size="13" font-weight="750" text-anchor="middle">1</text><text x="1353" y="346" class="st">SELECT</text><text x="1353" y="369" class="sm">capability · trust · state fit</text><path d="M1446 384v30" class="line"/><rect width="300" height="66" x="1296" y="416" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><circle cx="1326" cy="449" r="15" fill="#fde68a" stroke="#111827" stroke-width="2"/><path fill="none" stroke="#111827" stroke-width="2" d="M1317 449h18M1330 443l6 6-6 6"/><text x="1353" y="444" class="st">HAND OFF</text><text x="1353" y="467" class="sm">preserve context + authority</text><path d="M1446 482v30" class="line"/><rect width="300" height="66" x="1296" y="514" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><circle cx="1319" cy="547" r="11" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><circle cx="1335" cy="547" r="11" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><text x="1358" y="542" class="st">COMPOSE</text><text x="1358" y="565" class="sm">delegate · parallel · synthesize</text><text x="1446" y="620" class="sm" text-anchor="middle">Explicit limits · single-agent fallback</text></g><g class="s"><text x="836" y="738" class="pt" text-anchor="middle">EVALUATE THE COMPLETE AGENTIC ROUTE</text><rect width="1362" height="77" x="155" y="775" fill="#fcfcfd" stroke="#111827" stroke-width="2" rx="13"/><circle cx="209" cy="813" r="18" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path fill="none" stroke="#2563eb" stroke-width="3" d="M199 813l7 7 14-18"/><text x="241" y="819" class="st">Instruction retention</text><line x1="426" x2="426" y1="793" y2="833" stroke="#d0d5dd"/><circle cx="468" cy="813" r="18" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><text x="468" y="819" class="st" text-anchor="middle">Q</text><text x="500" y="819" class="st">Selection quality</text><line x1="682" x2="682" y1="793" y2="833" stroke="#d0d5dd"/><circle cx="724" cy="813" r="18" fill="#fde68a" stroke="#111827" stroke-width="2"/><text x="724" y="819" class="st" text-anchor="middle">+</text><text x="756" y="819" class="st">Collaboration gain</text><line x1="951" x2="951" y1="793" y2="833" stroke="#d0d5dd"/><circle cx="993" cy="813" r="18" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><text x="993" y="819" class="st" text-anchor="middle">!</text><text x="1025" y="819" class="st">Handoff + context loss</text><line x1="1278" x2="1278" y1="793" y2="833" stroke="#d0d5dd"/><circle cx="1320" cy="813" r="18" fill="#fff" stroke="#111827" stroke-width="2"/><path fill="none" stroke="#111827" stroke-width="2" d="M1320 801v13l9 6"/><text x="1348" y="819" fill="#111827" font-size="15" font-weight="750">Latency · cost · safety</text></g><g class="s"><rect width="1592" height="1" x="40" y="900" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">context optimization · session state · agent selection and handoff · bounded multi-agent collaboration</text><text x="1624" y="925" class="sm" text-anchor="end">Not a general agent orchestrator · MoM owns model-level collaboration</text></g></svg>