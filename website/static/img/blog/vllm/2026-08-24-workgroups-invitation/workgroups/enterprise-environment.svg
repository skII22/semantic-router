<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" aria-labelledby="title desc" role="img" viewBox="0 0 1672 941"><title id="title">Enterprise and Environment Workgroup</title><desc id="desc">Operators and applications use provider-backed identity, management authorization, and audit boundaries. A production management layer activates versioned snapshots into supported Docker and Kubernetes environments across qualified hardware, with monitoring and rollback.</desc><defs><linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1d2939" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#111827" d="M0 0l10 5-10 5z"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt,.st{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card,.line{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke-width:2.5;marker-end:url(#arrow)}</style></defs><rect width="1672" height="941" fill="#fff"/><g class="s"><path fill="#FDB515" d="M0 8.65h16.22V40L0 8.65z" transform="translate(48 35)"/><path fill="#30A2FF" d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" transform="translate(48 35)"/><text x="53" y="25" fill="#111827" font-size="25" font-weight="780" transform="translate(48 35)">vLLM</text><text x="53" y="42" fill="#475467" font-size="12" font-weight="720" letter-spacing="1.4" transform="translate(48 35)">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 04</text><text x="1624" y="75" fill="#2563eb" font-size="16" font-weight="650">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">ENTERPRISE &amp; ENVIRONMENT</text><text x="836" y="137" class="sub">Make vLLM Semantic Router production-grade across supported environments and hardware.</text></g><g class="s" filter="url(#shadow)"><rect width="225" height="350" x="43" y="236" fill="url(#blue)" class="card" rx="15"/><text x="155.5" y="275" class="pt" text-anchor="middle">CLIENTS</text><circle cx="117" cy="328" r="28" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><circle cx="117" cy="320" r="9" fill="#fff" stroke="#111827" stroke-width="2"/><path fill="#fff" stroke="#111827" stroke-width="2" d="M99 345c4-13 31-13 36 0"/><text x="163" y="325" class="st">OPERATORS</text><text x="163" y="348" fill="#475467" font-size="12">provider identities</text><rect width="60" height="60" x="87" y="386" fill="#fff" stroke="#111827" stroke-width="2" rx="10"/><path fill="#b9e4ae" stroke="#111827" stroke-width="1.5" d="M100 430v-21h9v21M113 430v-33h9v33M126 430v-14h9v14"/><text x="163" y="407" class="st">APPS</text><text x="163" y="430" fill="#475467" font-size="12">management clients</text><rect width="60" height="60" x="87" y="474" fill="#fff" stroke="#111827" stroke-width="2" rx="10"/><path fill="#fde68a" stroke="#111827" stroke-width="2" d="M104 491h26v26h-26zM97 500h7M130 500h7M117 484v7M117 517v9"/><text x="158" y="495" fill="#111827" font-size="15" font-weight="750">AUTOMATION</text><text x="158" y="518" fill="#475467" font-size="12">agents + services</text><text x="155.5" y="561" class="sm" text-anchor="middle">trusted identity · permission</text></g><path d="M268 411h47" class="line"/><g class="s" filter="url(#shadow)"><rect width="380" height="442" x="317" y="190" fill="url(#amber)" class="card" rx="17"/><text x="507" y="229" class="pt" text-anchor="middle">SECURITY BOUNDARIES</text><text x="507" y="253" class="sm" text-anchor="middle">Who may operate each management surface?</text><rect width="320" height="72" x="347" y="285" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="#fde68a" stroke="#111827" stroke-width="2" d="M378 312a14 14 0 0128 0v10h-28z"/><rect width="38" height="25" x="373" y="320" fill="#fde68a" stroke="#111827" stroke-width="2" rx="5"/><text x="431" y="316" class="st">PROVIDER IDENTITY</text><text x="431" y="339" class="sm">OIDC login · trusted claims</text><rect width="320" height="72" x="347" y="376" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><circle cx="392" cy="412" r="19" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path stroke="#111827" stroke-width="2" d="M392 400v24M380 412h24"/><text x="431" y="407" class="st">ROUTE AUTHORIZATION</text><text x="431" y="430" class="sm">explicit permissions · safe defaults</text><rect width="320" height="72" x="347" y="467" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="#b9e4ae" stroke="#111827" stroke-width="2" d="M371 520h43v-29h-43z"/><path stroke="#111827" stroke-width="3" d="M379 512v-10M391 512v-18M403 512v-7"/><text x="431" y="498" class="st">AUDIT EVENTS</text><text x="431" y="521" class="sm">redacted · durable · exportable</text><rect width="320" height="47" x="347" y="558" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><text x="507" y="587" class="st" text-anchor="middle">CREDENTIAL + INPUT SAFETY</text></g><path d="M697 411h47" class="line"/><g class="s" filter="url(#shadow)"><rect width="420" height="442" x="746" y="190" fill="url(#violet)" class="card" rx="17"/><text x="956" y="229" class="pt" text-anchor="middle">PRODUCTION MANAGEMENT</text><text x="956" y="253" class="sm" text-anchor="middle">Operate versioned state safely across replicas</text><rect width="354" height="84" x="779" y="285" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><rect width="43" height="42" x="804" y="307" fill="#ddd6fe" stroke="#111827" stroke-width="2" rx="6"/><path stroke="#111827" stroke-width="2" d="M814 320h23M814 331h23M814 342h15"/><text x="868" y="318" class="st">VERSIONED SNAPSHOT</text><text x="868" y="343" class="sm">model pool · recipe · Router config</text><path d="M956 369v34" class="line"/><rect width="166" height="92" x="779" y="405" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="#bfdbfe" stroke="#111827" stroke-width="1.7" d="M807 465v-37h27v37M842 465v-25h27v25M877 465v-47h27v47"/><text x="862" y="486" class="sm" text-anchor="middle">gray release</text><rect width="166" height="92" x="967" y="405" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="none" stroke="#388e3c" stroke-width="3" marker-end="url(#arrow)" d="M1012 446a24 24 0 1041-17"/><text x="1050" y="486" class="sm" text-anchor="middle">rollback</text><rect width="354" height="83" x="779" y="522" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="none" stroke="#6d5bd0" stroke-width="3" d="M805 580v-35h70v35M821 580v-21M839 580v-12M857 580v-29"/><text x="895" y="553" class="st">HEALTH + CONSISTENCY</text><text x="895" y="578" fill="#475467" font-size="13">monitor · diagnose · recover · reconcile</text></g><path d="M1166 411h47" class="line"/><g class="s" filter="url(#shadow)"><rect width="413" height="442" x="1215" y="190" fill="url(#green)" class="card" rx="17"/><text x="1421.5" y="229" class="pt" text-anchor="middle">SUPPORTED ENVIRONMENTS</text><text x="1421.5" y="253" class="sm" text-anchor="middle">A tested support matrix—not an unbounded promise</text><rect width="349" height="88" x="1247" y="285" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="#bfdbfe" stroke="#111827" stroke-width="2" d="M1272 309h62v43h-62z"/><path stroke="#111827" stroke-width="2" d="M1282 322h42M1282 336h26"/><text x="1355" y="319" class="st">PACKAGING</text><text x="1355" y="344" class="sm">Docker · images · precision</text><rect width="349" height="88" x="1247" y="392" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><path fill="#ddd6fe" stroke="#111827" stroke-width="2" d="M1270 456l31-51 31 51z"/><circle cx="1301" cy="440" r="7" fill="#fff" stroke="#111827"/><text x="1355" y="426" class="st">ORCHESTRATION</text><text x="1355" y="451" class="sm">Docker · Kubernetes · replicas</text><rect width="349" height="88" x="1247" y="499" fill="#fff" stroke="#111827" stroke-width="2" rx="11"/><rect width="62" height="42" x="1271" y="522" fill="#fde68a" stroke="#111827" stroke-width="2" rx="6"/><path fill="#fff" stroke="#111827" stroke-width="1.5" d="M1282 532h11v11h-11zM1300 532h11v11h-11zM1318 532h7v11h-7zM1282 550h43"/><text x="1355" y="533" class="st">HARDWARE</text><text x="1355" y="558" class="sm">CPU · AMD · NVIDIA</text><text x="1421.5" y="613" class="sm" text-anchor="middle">Qualified versions · maintained configurations</text></g><g class="s"><text x="836" y="686" class="pt" text-anchor="middle">PRODUCTION OUTCOMES</text><text x="836" y="711" class="sm" text-anchor="middle">Reusable open-source capabilities for stable, scalable, observable operation</text><rect width="300" height="94" x="160" y="752" fill="url(#blue)" stroke="#111827" stroke-width="2" rx="12"/><text x="310" y="789" class="st" text-anchor="middle">SECURE MANAGEMENT</text><text x="310" y="816" class="sm" text-anchor="middle">identity, authorization, and audit</text><rect width="300" height="94" x="496" y="752" fill="url(#green)" stroke="#111827" stroke-width="2" rx="12"/><text x="646" y="789" class="st" text-anchor="middle">SAFE LIFECYCLE</text><text x="646" y="816" class="sm" text-anchor="middle">activate, drain, promote, and reverse</text><rect width="300" height="94" x="832" y="752" fill="url(#amber)" stroke="#111827" stroke-width="2" rx="12"/><text x="982" y="789" class="st" text-anchor="middle">OPERABILITY</text><text x="982" y="816" class="sm" text-anchor="middle">monitor, diagnose, audit, and recover</text><rect width="344" height="94" x="1168" y="752" fill="url(#violet)" stroke="#111827" stroke-width="2" rx="12"/><text x="1340" y="789" class="st" text-anchor="middle">QUALIFIED PORTABILITY</text><text x="1340" y="816" class="sm" text-anchor="middle">supported deployments and hardware paths</text></g><g class="s"><rect width="1592" height="1" x="40" y="900" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">management security · lifecycle controls · capacity planning · observability · supported environments</text><text x="1624" y="925" class="sm" text-anchor="end">Developer Experience supplies the Dashboard and CLI over these contracts</text></g></svg>